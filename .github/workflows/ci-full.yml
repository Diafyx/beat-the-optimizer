name: CI full run

# Adding the ci:full label starts a full run of CI on the pull request's
# branch: ci.yml started by hand runs every job, and its checks report on the
# head commit like the pull request's own run. ci.yml does not listen to
# label events itself, so the type, area and size labels set when a pull
# request opens start no runs and cancel none (#94).
#
# A pull request from a fork gets a read-only token and cannot start the run;
# a maintainer starts ci.yml by hand on its branch instead.
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  start:
    name: start full run
    if: github.event.label.name == 'ci:full' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # start ci.yml
    steps:
      - name: Start ci.yml on the pull request's branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          echo "Started a full CI run on \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
