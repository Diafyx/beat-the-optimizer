name: CI

on:
  # Not on `labeled`: each label set on a new pull request would start a run
  # that cancels the one before it. ci-full.yml starts a full run for ci:full.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_call:
    inputs:
      full:
        description: Run every job regardless of changed paths
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request, cancelling older runs. Every other run gets its
  # own group, so runs on main are never cancelled.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API
    outputs:
      code: ${{ steps.select.outputs.code }}
      authoring: ${{ steps.select.outputs.authoring }}
      docs: ${{ steps.select.outputs.docs }}
      android: ${{ steps.select.outputs.android }}
      skippable: ${{ steps.select.outputs.skippable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          SHARED: ${{ steps.filter.outputs.shared }}
          ENGINE: ${{ steps.filter.outputs.engine }}
          APP: ${{ steps.filter.outputs.app }}
          TESTS: ${{ steps.filter.outputs.tests }}
          SCRIPTS: ${{ steps.filter.outputs.scripts }}
          AUTHORING: ${{ steps.filter.outputs.authoring }}
          LEVELS: ${{ steps.filter.outputs.levels }}
          DOCS: ${{ steps.filter.outputs.docs }}
          ANDROID: ${{ steps.filter.outputs.android }}
        run: |
          # Full run: anything but a pull request, `full: true`, the ci:full
          # label, or a change to a shared input.
          full=false
          if [[ $EVENT != pull_request || $FULL_INPUT == true || $FULL_LABEL == true || $SHARED == true ]]; then
            full=true
          fi
          code=false
          if [[ $full == true || $ENGINE == true || $APP == true || $TESTS == true || $SCRIPTS == true || $AUTHORING == true || $LEVELS == true ]]; then
            code=true
          fi
          authoring=false
          if [[ $full == true || $AUTHORING == true || $LEVELS == true ]]; then
            authoring=true
          fi
          docs=false
          if [[ $full == true || $DOCS == true ]]; then
            docs=true
          fi
          android=false
          if [[ $full == true || $ANDROID == true ]]; then
            android=true
          fi
          # Jobs ci-gate may accept as skipped: only the ones not selected here.
          skippable=()
          [[ $code == true ]] || skippable+=(typecheck unit coverage levels e2e a11y lighthouse bundle-size)
          [[ $authoring == true ]] || skippable+=(authoring-check)
          [[ $docs == true ]] || skippable+=(docs)
          [[ $android == true ]] || skippable+=(android)
          skippable_csv=$(IFS=,; echo "${skippable[*]}")
          {
            echo "code=$code"
            echo "authoring=$authoring"
            echo "docs=$docs"
            echo "android=$android"
            echo "skippable=$skippable_csv"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Selected jobs"
            echo "| full | code | authoring | docs | android | allowed skips |"
            echo "|---|---|---|---|---|---|"
            echo "| $full | $code | $authoring | $docs | $android | ${skippable_csv:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check-filters
      - run: npm run check-lockfile
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv tool install pre-commit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # typos, actionlint, zizmor, whitespace and YAML checks, as run locally.
      - run: npm run hooks

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: unit (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Vitest's github-actions reporter writes the job summary and failure
      # annotations (see vite.config.ts).
      - run: npm run unit
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-unit-node-${{ matrix.node }}
          path: reports/junit.xml
          if-no-files-found: error
      # Coverage is the same on every Node version; the coverage job uses the
      # leg that matches .nvmrc.
      - if: matrix.node == '26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: coverage/lcov.info
          if-no-files-found: error

  coverage:
    name: coverage
    needs: [changes, unit, authoring-check]
    # Waits for authoring-check, which is skipped unless authoring is selected.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.unit.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # diff-cover compares with origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-unit
          path: coverage
      # The authoring run's coverage of scripts/author-level.ts, which the unit
      # tests cannot reach. The files differ, so the reports simply concatenate.
      - if: needs.authoring-check.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-authoring
          path: coverage
      - if: needs.authoring-check.result == 'success'
        run: cat coverage/authoring.info >> coverage/lcov.info
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The unit job already applied the line and branch thresholds; this adds
      # 100% diff coverage on the lines this pull request changes.
      - run: npm run coverage
      - if: ${{ !cancelled() }}
        run: cat coverage/diff-cover.md >> "$GITHUB_STEP_SUMMARY"

  # Every level file against the schema and the rules in docs/level-format.md.
  # The engine recomputes the costs, so engine changes run it too.
  levels:
    name: levels
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run levels

  # Authors every level against PostgreSQL and fails on any difference from
  # the committed files (authoring.yml). Nightly runs it through the full run.
  authoring-check:
    name: authoring-check
    needs: changes
    if: needs.changes.outputs.authoring == 'true'
    # A job-level call has no earlier steps that could change `./`.
    uses: ./.github/workflows/authoring.yml # zizmor: ignore[self-repository]
    with:
      check: true
    permissions:
      contents: read

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the link check compares with origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs

  # Browser gates against the production build (playwright.config.ts). They run
  # in Playwright's image, which has every browser and its system libraries:
  # installing WebKit's with apt took up to 18 minutes on hosted runners. The
  # tag must match @playwright/test (tests/scripts/playwright-image.test.ts).
  e2e:
    name: e2e (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --user 1001 # the runner's user, which owns the workspace
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run e2e -- --project="$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.project }}
          path: |
            reports/junit-e2e.xml
            playwright-report/
          if-no-files-found: error

  a11y:
    name: a11y
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # axe on desktop Chromium and the mobile viewport.
      - run: npm run a11y
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y
          path: |
            reports/junit-e2e.xml
            playwright-report/
          if-no-files-found: error

  lighthouse:
    name: lighthouse
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Mobile defaults, median of 5 runs, budgets in lighthouserc.json.
      - run: npm run lighthouse
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: reports/lighthouse/
          if-no-files-found: error

  bundle-size:
    name: bundle-size
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Writes the per-file table to the job summary.
      - run: npm run bundle-size

  # The Google Play app (docs/android-app.md) builds, unsigned, in debug.
  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The app build needs SITE_URL; the address does not matter here.
      - run: npm run build-app
        env:
          SITE_URL: https://beat-the-optimizer.invalid
      - run: npx cap sync android
      # The runner's Android SDK (ANDROID_HOME) and JDK 21, which Capacitor needs.
      - run: JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew assembleDebug --no-daemon
        working-directory: android

  ci-gate:
    name: ci-gate
    # Not always(): in a cancelled run every job reads as cancelled, and a gate
    # that ran anyway would leave a failed ci-gate on the commit.
    if: ${{ !cancelled() }}
    needs:
      [
        changes,
        lint,
        typecheck,
        unit,
        coverage,
        levels,
        authoring-check,
        docs,
        e2e,
        a11y,
        lighthouse,
        bundle-size,
        android,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Passes only if every job succeeded or was skipped because `changes`
      # did not select it. A failed or cancelled job fails the gate.
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.changes.outputs.skippable }}
