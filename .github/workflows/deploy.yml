name: Deploy

# Deploys main to production on Cloudflare (wrangler.jsonc) after the
# maintainer approves it in the `production` environment, then runs the smoke
# test (e2e/smoke.live.ts) against the live site. The release workflow calls
# it after the full CI run; it can also be started by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

# One deploy at a time, and a deploy waiting for approval is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    name: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    outputs:
      url: ${{ vars.SITE_URL }}
    env:
      # The production environment's variables (AGENTS.md, "Build settings").
      SITE_URL: ${{ vars.SITE_URL }}
      GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # Without SITE_URL, link previews would point at the .invalid default.
      - run: |
          if [[ -z $SITE_URL ]]; then
            echo "::error title=deploy::Set the SITE_URL variable of the production environment."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    name: smoke
    needs: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
        env:
          SMOKE_URL: ${{ needs.production.outputs.url }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke
          path: |
            reports/junit-smoke.xml
            playwright-report/
          if-no-files-found: error
