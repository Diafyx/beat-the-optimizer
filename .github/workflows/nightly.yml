name: Nightly

# The slow checks, daily on main: every CI job, mutation testing of the engine
# and the links in every Markdown file. A failure opens one tracking issue, or
# comments on the open one (scripts/report-failure.ts).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force-failure:
        description: Fail on purpose, to test the tracking issue
        type: boolean
        default: false

permissions: {}

# One run at a time, so two failures never open two issues.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    # `$/` is the newer form, but actionlint rejects it until rhysd/actionlint#711
    # ships. A job-level call has no earlier steps that could change `./`.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      full: true
    permissions:
      contents: read
      pull-requests: read # ci.yml's changes job asks for it

  mutation:
    name: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Stryker on src/engine; fails below 90% killed (stryker.config.json).
      - run: npm run mutation
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation
          path: reports/mutation/
          if-no-files-found: error

  links:
    name: links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run links-all

  forced-failure:
    name: forced-failure
    if: inputs.force-failure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: |
          echo "::error title=forced-failure::Started with force-failure, to test the tracking issue."
          exit 1

  report:
    name: report
    needs: [ci, mutation, links, forced-failure]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script imports only Node built-ins, so it needs no npm ci.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/report-failure.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
