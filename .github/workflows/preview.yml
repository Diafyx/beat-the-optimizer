name: Preview

# Every pull request's build as a preview on Cloudflare (wrangler.jsonc), with
# its address in a comment that each push updates. Production keeps serving
# its own version; deploy.yml changes that.
#
# Triggered by pull_request, never pull_request_target. Forks and Dependabot
# get no secrets, so their pull requests have no preview. This is not a CI
# gate: a Cloudflare outage does not block a merge.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-deploy:
    name: preview-deploy
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the preview comment
    environment:
      name: preview
      url: ${{ steps.comment.outputs.url }}
    env:
      WRANGLER_SEND_METRICS: 'false'
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The preview environment's variables (AGENTS.md, "Build settings").
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      # A new version of the Worker with the alias pr-<number>.
      - run: npx wrangler versions upload --preview-alias "pr-$PR_NUMBER"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
      - id: comment
        run: node scripts/preview-comment.ts
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
