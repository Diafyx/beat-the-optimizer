name: Labels

# Labels as code: .github/labels.yml is the only source of labels.
# Labels missing from the file are deleted. release-please's labels are in the
# file, so they are kept.
on:
  push:
    branches: [main]
    paths: [.github/labels.yml, .github/workflows/labels.yml]
  pull_request:
    paths: [.github/labels.yml, .github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labels-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  check:
    name: labels (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: .github/labels.yml
          delete-other-labels: true
          dry-run: true

  sync:
    name: labels (sync)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # create, update and delete labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: .github/labels.yml
          delete-other-labels: true
