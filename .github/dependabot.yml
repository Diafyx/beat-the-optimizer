# Weekly version updates for npm and GitHub Actions. Minor and patch updates
# are grouped into one pull request per ecosystem; each major update gets its
# own. Titles and labels follow the pull request rules, so pr-hygiene passes
# (tests/scripts/dependabot.test.ts checks this). Dependabot pull requests are
# never merged automatically.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Only propose versions that have been public for a week.
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
    labels: [dependencies, type/build, area/ci]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci(deps)
    labels: [dependencies, type/ci, area/ci]
