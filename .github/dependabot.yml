# Weekly version updates for npm and GitHub Actions. Minor and patch updates
# are grouped into one pull request per ecosystem; each major update gets its
# own. Titles and labels follow the pull request rules, so pr-hygiene passes
# (tests/scripts/dependabot.test.ts checks this). Dependabot pull requests are
# never merged automatically.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Only propose versions that have been public for a week.
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
    labels: [dependencies, type/build, area/ci]
    ignore:
      # The Node types follow the oldest supported Node in package.json
      # `engines` (22), so code cannot use APIs that Node 22 lacks. Remove
      # when Node 22 support is dropped, and set the new oldest major.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint does not support TypeScript 7 yet (its peer range
      # is <6.1.0), so the update cannot resolve. Remove when it does.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci(deps)
    labels: [dependencies, type/ci, area/ci]
