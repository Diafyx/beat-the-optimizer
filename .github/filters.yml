# Path filters for ci.yml, read by dorny/paths-filter in the `changes` job.
# Every file in the repository must match at least one group:
# `npm run check-filters` fails otherwise. A new folder gets a group (or joins
# one) in the same pull request.
#
# A change in `shared` runs every job.
shared:
  - '.github/**'
  - 'package.json'
  - 'package-lock.json'
  - '.npmrc'
  - '.gitattributes'
  - '.gitignore'
  - '.nvmrc'
  - '.editorconfig'
  - '.pre-commit-config.yaml'
  - '.prettierrc.json'
  - '.prettierignore'
  - '.markdownlint-cli2.jsonc'
  - 'eslint.config.js'
  - 'tsconfig*.json'
  - 'vite.config.ts'
  - 'playwright.config.ts'
  - 'lighthouserc.json'
  - 'stryker.config.json'

engine:
  - 'src/engine/**'

app:
  - 'src/**'
  - 'index.html'
  - 'public/**'

tests:
  - 'tests/**'
  - 'e2e/**'

scripts:
  - 'scripts/**'

# The generator, EXPLAIN mapper and level writer (MIT). Level specs are in levels/.
authoring:
  - 'authoring/**'

# The level format's schema runs the same jobs as the levels it describes.
levels:
  - 'levels/**'
  - 'schema/**'

docs:
  - '**/*.md'
  - 'docs/**'
  - 'LICENSE'
