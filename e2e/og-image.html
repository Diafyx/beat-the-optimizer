<!doctype html>
<!-- The link preview, public/og-image.png: rendered at 1200 × 630 by
     e2e/screenshots.shots.ts (npm run screenshots). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Beat the Optimizer: link preview</title>
    <style>
      @font-face {
        font-family: Barlow;
        src: url('../public/fonts/barlow-400.woff2') format('woff2');
        font-weight: 400;
      }

      @font-face {
        font-family: 'Barlow Condensed';
        src: url('../public/fonts/barlow-condensed-600.woff2') format('woff2');
        font-weight: 600;
      }

      @font-face {
        font-family: 'Barlow Condensed';
        src: url('../public/fonts/barlow-condensed-800-italic.woff2') format('woff2');
        font-weight: 800;
        font-style: italic;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 64px 80px;
        color: #f3f1ea;
        font:
          400 34px/1.35 Barlow,
          sans-serif;
        background:
          radial-gradient(90% 70% at 20% -20%, rgb(255 90 31 / 28%), transparent 60%),
          repeating-linear-gradient(115deg, rgb(255 255 255 / 2.5%) 0 3px, transparent 3px 12px),
          #0e1012;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font:
          italic 800 30px/1 'Barlow Condensed',
          sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #ff5a1f;
      }

      .brand i {
        width: 54px;
        height: 36px;
        background: conic-gradient(#f3f1ea 0 25%, #0e1012 0 50%, #f3f1ea 0 75%, #0e1012 0) 0 0 /
          18px 18px;
        transform: skewX(-12deg);
      }

      h1 {
        margin: 18px 0 14px;
        font:
          italic 800 116px/0.86 'Barlow Condensed',
          sans-serif;
        text-transform: uppercase;
      }

      p {
        margin: 0;
        font-size: 30px;
        color: #c9ccd1;
      }

      .lanes {
        position: absolute;
        right: 80px;
        bottom: 56px;
        left: 80px;
        display: grid;
        gap: 14px;
      }

      .lane {
        display: grid;
        grid-template-columns: 300px 1fr 200px;
        align-items: center;
        gap: 24px;
        padding: 10px 22px;
        background: #171a1d;
        border: 1px solid #2f343a;
        border-left: 10px solid var(--c);
        border-radius: 4px;
      }

      .who {
        font:
          italic 800 34px/1 'Barlow Condensed',
          sans-serif;
        text-transform: uppercase;
      }

      .strip {
        height: 20px;
        background: #0a0b0d;
        transform: skewX(-18deg);
        overflow: hidden;
      }

      .strip span {
        display: block;
        height: 100%;
        width: var(--w);
        background: repeating-linear-gradient(
          90deg,
          var(--c) 0 22px,
          color-mix(in srgb, var(--c) 70%, #000) 22px 28px
        );
      }

      .count {
        text-align: right;
        font:
          italic 800 40px/1 'Barlow Condensed',
          sans-serif;
        color: var(--c);
      }
    </style>
  </head>
  <body>
    <div class="brand"><i></i>A daily SQL puzzle</div>
    <h1>Beat the<br />Optimizer</h1>
    <p>Build a query plan, then race the one PostgreSQL chose. Fewer rows wins.</p>
    <div class="lanes" aria-hidden="true">
      <div class="lane" style="--c: #ff5a1f; --w: 41%">
        <span class="who">You</span><span class="strip"><span></span></span
        ><span class="count">100,000</span>
      </div>
      <div class="lane" style="--c: #3d8bff; --w: 100%">
        <span class="who">The Optimizer</span><span class="strip"><span></span></span
        ><span class="count">241,332</span>
      </div>
    </div>
  </body>
</html>
