  id: haystack
  title: Haystack
  story:
    - Finance wants every order that has shipped.
    - There is an index on status. Should you use it?
  select:
    - { table: orders, column: order_id }
    - { table: orders, column: customer_id }
  filters:
    - { table: orders, column: status, op: '=', value: shipped }
  joins: []
  orderBy: null
  locks: []
  stats:
    - { table: orders, column: status }
