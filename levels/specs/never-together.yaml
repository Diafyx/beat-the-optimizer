# yaml-language-server: $schema=../../schema/level-spec.schema.json
seed: 1024
tables:
  - name: customers
    rows: 5000
    order: customer_id
    columns:
      - name: customer_id
        type: integer
        values: { kind: sequence }
      - name: name
        type: text
        values: { kind: label, prefix: 'customer ' }
      - name: country
        type: text
        values:
          kind: weighted
          weights:
            - { value: US, weight: 40 }
            - { value: DE, weight: 30 }
            - { value: FR, weight: 20 }
            - { value: GB, weight: 10 }
    indexes:
      - { name: customers_pkey, column: customer_id, unique: true }
  # Every order is paid in its customer's currency.
  - name: orders
    rows: 100000
    order: shuffled
    columns:
      - name: order_id
        type: integer
        values: { kind: sequence }
      - name: customer_id
        type: integer
        values: { kind: reference, table: customers, column: customer_id }
      - name: currency
        type: text
        values:
          kind: follows
          through: customer_id
          column: country
          map:
            - { from: US, to: USD }
            - { from: DE, to: EUR }
            - { from: FR, to: EUR }
            - { from: GB, to: GBP }
    indexes:
      - { name: orders_pkey, column: order_id, unique: true }
      - { name: orders_customer_id_idx, column: customer_id }
  # Five lines an order.
  - name: order_lines
    rows: 500000
    order: shuffled
    columns:
      - name: line_id
        type: integer
        values: { kind: sequence }
      - name: order_id
        type: integer
        values: { kind: reference, table: orders, column: order_id }
      - name: item
        type: text
        values: { kind: label, prefix: 'item ' }
    indexes:
      - { name: order_lines_order_id_idx, column: order_id }
afterAnalyze: []
level:
  id: never-together
  title: Never together
  story:
    - 'Finance read a report that some American customers paid in euros. They want the order lines of those orders.'
    - "The shop has 5,000 customers in four countries. Each order is paid in its customer's currency, and each has five lines."
  select:
    - { table: customers, column: name }
    - { table: order_lines, column: item }
  filters:
    - { table: customers, column: country, op: '=', value: US }
    - { table: orders, column: currency, op: '=', value: EUR }
  joins:
    - left: { table: customers, column: customer_id }
      right: { table: orders, column: customer_id }
    - left: { table: orders, column: order_id }
      right: { table: order_lines, column: order_id }
  orderBy: null
  locks: []
  stats:
    - { table: customers, column: country }
    - { table: orders, column: currency }
  explanation:
    - 'PostgreSQL read all 500,000 order lines and hashed them with the 49,781 orders paid in euros, 500,000 + 100,000 + 549,781, which gave 249,004 rows. Then it hashed those with the 2,000 American customers, 5,000 + 251,004. Nothing matched: the plan costs 1,654,789 and returns no rows.'
    - "Its statistics say 40% of customers are American and half the orders are paid in euros. It multiplied the two as if they were independent, so it expected the customers and their euro orders to join to about 19,900 rows, and 99,560 at the end. For that many orders, reading every line once looked cheaper than looking them up. But each order is paid in its customer's currency, and American customers pay in dollars."
    - 'Hash the American customers with the euro orders first, 5,000 + 100,000 + 51,781. That join is empty, so looking up lines through order_lines_order_id_idx costs nothing, and the plan costs 156,781. When filters on two tables can never both be true, PostgreSQL still multiplies their shares and plans for rows that never come.'
