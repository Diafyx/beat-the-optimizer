# yaml-language-server: $schema=../../schema/level-spec.schema.json
seed: 1006
tables:
  - name: customers
    rows: 10000
    order: customer_id
    columns:
      - name: customer_id
        type: integer
        values: { kind: sequence }
      - name: name
        type: text
        values: { kind: label, prefix: 'customer ' }
    indexes:
      - { name: customers_pkey, column: customer_id, unique: true }
  - name: orders
    rows: 100000
    order: order_id
    columns:
      - name: order_id
        type: integer
        values: { kind: sequence }
      # About ten orders for each customer.
      - name: customer_id
        type: integer
        values: { kind: reference, table: customers, column: customer_id }
      - name: status
        type: text
        values:
          kind: weighted
          weights:
            - { value: shipped, weight: 70 }
            - { value: pending, weight: 20 }
            - { value: cancelled, weight: 10 }
      - name: amount
        type: integer
        values: { kind: uniform, min: 1, max: 500 }
    indexes:
      - { name: orders_pkey, column: order_id, unique: true }
      - { name: orders_customer_id_idx, column: customer_id }
afterAnalyze: []
level:
  id: every-shipped-order
  title: Every shipped order
  story:
    - Finance wants every shipped order with the name of its customer.
    - Last time an index nested loop was the answer. This time there is no single customer to start from.
  select:
    - { table: customers, column: name }
    - { table: orders, column: order_id }
    - { table: orders, column: amount }
  filters:
    - { table: orders, column: status, op: '=', value: shipped }
  joins:
    - left: { table: customers, column: customer_id }
      right: { table: orders, column: customer_id }
  orderBy: null
  locks: []
  stats:
    - { table: orders, column: status }
  explanation:
    - DRAFT
