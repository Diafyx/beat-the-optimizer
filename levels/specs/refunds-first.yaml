# yaml-language-server: $schema=../../schema/level-spec.schema.json
seed: 1022
tables:
  # The smallest table.
  - name: customers
    rows: 2000
    order: customer_id
    columns:
      - name: customer_id
        type: integer
        values: { kind: sequence }
      - name: name
        type: text
        values: { kind: label, prefix: 'customer ' }
    indexes:
      - { name: customers_pkey, column: customer_id, unique: true }
  - name: orders
    rows: 100000
    order: order_id
    columns:
      - name: order_id
        type: integer
        values: { kind: sequence }
      - name: customer_id
        type: integer
        values: { kind: reference, table: customers, column: customer_id }
    indexes:
      - { name: orders_pkey, column: order_id, unique: true }
      - { name: orders_customer_id_idx, column: customer_id }
  # One refund for about one order in ten.
  - name: refunds
    rows: 10000
    order: shuffled
    columns:
      - name: refund_id
        type: integer
        values: { kind: sequence }
      - name: order_id
        type: integer
        values: { kind: reference, table: orders, column: order_id }
      - name: amount
        type: integer
        values: { kind: uniform, min: 1, max: 500 }
    indexes:
      - { name: refunds_pkey, column: refund_id, unique: true }
      - { name: refunds_order_id_idx, column: order_id }
afterAnalyze: []
level:
  id: refunds-first
  title: Refunds first
  story:
    - Finance wants every refund with the name of the customer who got it.
    - The query reads customers, then orders, then refunds. Customers is the smallest table.
  select:
    - { table: customers, column: name }
    - { table: refunds, column: refund_id }
    - { table: refunds, column: amount }
  filters: []
  joins:
    - left: { table: customers, column: customer_id }
      right: { table: orders, column: customer_id }
    - left: { table: orders, column: order_id }
      right: { table: refunds, column: order_id }
  orderBy: null
  locks: []
  stats: []
  explanation:
    - 'PostgreSQL chose the right order, and its estimates were exact: it joined orders to refunds first, which keeps 10,000 rows, and added the 2,000 customers last. Starting from customers, the smallest table, the first join keeps all 100,000 orders, and that plan costs 434,000. But PostgreSQL read all 100,000 orders to find the ones with a refund: 100,000 + 10,000, a hash join of 110,000 and 10,000 for its result, then 2,000 + 12,000 + 10,000 for the customers, 254,000 in all. It prices reading a whole table by its pages, cheap next to 10,000 jumps, and here the two cost models disagree.'
    - "Reading the refunds and looking up each one's order through orders_pkey costs 10,000 + 4 × (10,000 + 10,000) = 90,000 and skips the orders without a refund. With the customers in a hash join, the plan costs 124,000. Start from the join that keeps the fewest rows, not from the smallest table."
