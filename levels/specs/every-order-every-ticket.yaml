# yaml-language-server: $schema=../../schema/level-spec.schema.json
seed: 1026
tables:
  - name: customers
    rows: 100000
    order: customer_id
    columns:
      - name: customer_id
        type: integer
        values: { kind: sequence }
      - name: name
        type: text
        values: { kind: label, prefix: 'customer ' }
      - name: country
        type: text
        values:
          kind: weighted
          weights:
            - { value: IS, weight: 2 }
            - { value: 'NO', weight: 23 }
            - { value: SE, weight: 25 }
            - { value: DK, weight: 20 }
            - { value: FI, weight: 15 }
            - { value: DE, weight: 15 }
    indexes:
      - { name: customers_pkey, column: customer_id, unique: true }
      - { name: customers_country_idx, column: country }
  - name: orders
    rows: 500000
    order: currency
    columns:
      - name: order_id
        type: integer
        values: { kind: sequence }
      - name: customer_id
        type: integer
        values: { kind: reference, table: customers, column: customer_id }
      - name: currency
        type: text
        values:
          kind: follows
          through: customer_id
          column: country
          map:
            - { from: IS, to: ISK }
            - { from: 'NO', to: NOK }
            - { from: SE, to: SEK }
            - { from: DK, to: DKK }
            - { from: FI, to: EUR }
            - { from: DE, to: EUR }
    indexes:
      - { name: orders_customer_id_idx, column: customer_id }
      - { name: orders_currency_idx, column: currency }
  - name: tickets
    rows: 500000
    order: shuffled
    columns:
      - name: ticket_id
        type: integer
        values: { kind: sequence }
      - name: customer_id
        type: integer
        values: { kind: reference, table: customers, column: customer_id }
      - name: priority
        type: text
        values:
          kind: weighted
          weights:
            - { value: normal, weight: 98 }
            - { value: urgent, weight: 2 }
    indexes:
      - { name: tickets_customer_id_idx, column: customer_id }
afterAnalyze: []
level:
  id: every-order-every-ticket
  title: Every order, every ticket
  story:
    - 'Support wants every krónur order of Icelandic customers, next to each urgent ticket the customer has open.'
    - 'The shop has 100,000 customers, 500,000 orders stored in currency order, and 500,000 tickets.'
  select:
    - { table: customers, column: name }
    - { table: orders, column: order_id }
    - { table: tickets, column: ticket_id }
  filters:
    - { table: customers, column: country, op: '=', value: IS }
    - { table: orders, column: currency, op: '=', value: ISK }
    - { table: tickets, column: priority, op: '=', value: urgent }
  joins:
    - left: { table: customers, column: customer_id }
      right: { table: orders, column: customer_id }
    - left: { table: customers, column: customer_id }
      right: { table: tickets, column: customer_id }
  orderBy: null
  locks: []
  stats:
    - { table: customers, column: country }
    - { table: orders, column: currency }
    - { table: tickets, column: priority }
  explanation:
    - Written after the first authoring run, from what PostgreSQL estimated.
