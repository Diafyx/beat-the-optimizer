# yaml-language-server: $schema=../../schema/level-spec.schema.json
seed: 1030
tables:
  - name: customers
    rows: 50000
    order: customer_id
    columns:
      - name: customer_id
        type: integer
        values: { kind: sequence }
      - name: name
        type: text
        values: { kind: label, prefix: 'customer ' }
      - name: country
        type: text
        values:
          kind: weighted
          weights:
            - { value: IS, weight: 20 }
            - { value: is, weight: 10 }
            - { value: 'NO', weight: 25 }
            - { value: SE, weight: 25 }
            - { value: DK, weight: 20 }
    indexes:
      - { name: customers_pkey, column: customer_id, unique: true }
  - name: products
    rows: 10000
    order: product_id
    columns:
      - name: product_id
        type: integer
        values: { kind: sequence }
      - name: title
        type: text
        values: { kind: label, prefix: 'product ' }
      - name: weight_kg
        type: integer
        values:
          kind: weighted
          weights:
            - { value: 1, weight: 50 }
            - { value: 2, weight: 30 }
            - { value: 5, weight: 19.9 }
            - { value: 40, weight: 0.1 }
    indexes:
      - { name: products_pkey, column: product_id, unique: true }
  - name: orders
    rows: 1000000
    order: order_id
    columns:
      - name: order_id
        type: integer
        values: { kind: sequence }
      - name: customer_id
        type: integer
        values: { kind: reference, table: customers, column: customer_id }
      - name: product_id
        type: integer
        values: { kind: reference, table: products, column: product_id }
    indexes:
      - { name: orders_customer_id_idx, column: customer_id }
      - { name: orders_product_id_idx, column: product_id }
afterAnalyze: []
level:
  id: two-guesses
  title: Two guesses
  story:
    - 'One sign-up form stored country codes in capitals and the other in lower case, and the courier works in grams, not kilograms.'
    - 'The courier wants every order of 20 kg or more that goes to Iceland, from 50,000 customers, 10,000 products and a million orders.'
  select:
    - { table: customers, column: name }
    - { table: products, column: title }
  filters:
    - { table: customers, column: country, op: '=', value: is, expression: { kind: lower } }
    - table: products
      column: weight_kg
      op: '>='
      value: 20000
      expression: { kind: times, by: 1000 }
  joins:
    - left: { table: customers, column: customer_id }
      right: { table: orders, column: customer_id }
    - left: { table: products, column: product_id }
      right: { table: orders, column: product_id }
  orderBy: null
  locks: []
  stats:
    - { table: customers, column: country }
    - { table: products, column: weight_kg }
  explanation:
    - 'Both filters are on expressions, so PostgreSQL guessed both: 0.5% for the equality on lower(country), 250 of 50,000 customers, and a third for the range on weight_kg * 1000, 3,333 of 10,000 products. The customers looked like the better start. It read all 50,000 and looked up their orders through orders_customer_id_idx, expecting 5,000.'
    - 'But IS and is are 30% of the customers, 15,000, and the lookups found 299,400 orders: 4 × (15,000 + 299,400) = 1,257,600. Reading the products, 10,000, and hashing the orders with the 10 that weigh 40 kg, 299,400 + 10, brings the plan to 1,916,726.'
    - "Start from the other guess. Read the products, 10,000, look up the 10 heavy ones' 1,034 orders through orders_product_id_idx, 4 × (10 + 1,034) = 4,176, and their customers through customers_pkey, 4 × (1,034 + 1,034) = 8,272: the plan costs 23,798, for 316 rows. A guess knows the operator, not the data: an equality always looks rarer than a range, so PostgreSQL started from the wrong end."
